services:
  shopmvc:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shopmvc-web
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Server=sqlserver,1433;Database=ShopMVC;User ID=sa;Password=${SA_PASSWORD:-YourStrong!Passw0rd};TrustServerCertificate=True;Encrypt=False;MultipleActiveResultSets=True
    ports:
      - "${APP_PORT:-8080}:8080"
    restart: unless-stopped
    networks:
      - shopnetwork

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: shopmvc-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: ${SA_PASSWORD:-YourStrong!Passw0rd}
      MSSQL_PID: Express
    ports:
      - "${SQL_PORT:-1433}:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$SA_PASSWORD" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped
    networks:
      - shopnetwork

volumes:
  sqlserver_data:

networks:
  shopnetwork:
    driver: bridge
